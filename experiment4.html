<html>
    <head>
        <title>Hotel Room Booking Form </title>
    </head>
    <body background="lightblue" bgcolor="lightblue" align="center">
        <h1>Hotel Room Booking Form</h1>
        <form action="submit_booking.php" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required><br><br

            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" name="checkin" required><br><br>

            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" name="checkout" required><br><br>

            <label for="room_type">Room Type:</label>
            <select id="room_type" name="room_type" required>
                <option value="">Select a room type</option>
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="suite">Suite</option>
            </select><br><br>

            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" min="1" required><br>

            <p>Special Requests:<br>
            <textarea name="special_requests"></textarea>
        </p>

        
            </select><br>
            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">
    </body>
</html>
